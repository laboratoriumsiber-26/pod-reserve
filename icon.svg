<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Premium Rounded Square Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle Cyber Tech Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" stroke-dasharray="8 12" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <g filter="url(#glow)">
    <!-- Microphone Capsule -->
    <rect x="220" y="140" width="72" height="120" rx="36" fill="url(#micGrad)" />
    
    <!-- Microphone Cradle/Arc -->
    <path d="M172 230 v 30 a 84 84 0 0 0 168 0 v -30" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
    
    <!-- Microphone Stand Stem -->
    <line x1="256" y1="344" x2="256" y2="400" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
    
    <!-- Microphone Stand Base -->
    <line x1="196" y1="400" x2="316" y2="400" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
  </g>
</svg>
